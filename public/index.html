<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Meta Viewport INI SANGAT PENTING untuk layar Mobile/HP -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Gudang</title>
    
    <!-- Memuat Bootstrap 5 CSS dari CDN agar tampilan rapi -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Sedikit kustomisasi warna dan jarak */
        body {
            background-color: #f4f6f9;
        }
        .container {
            max-width: 900px;
            margin-top: 2rem;
            margin-bottom: 2rem;
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="text-center mb-4 text-primary fw-bold">Aplikasi Manajemen Gudang</h2>

        <!-- Bagian Formulir Input Barang -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3">Tambah Barang</h5>
                <!-- Pastikan id form sesuai dengan script JS Anda -->
                <form id="formGudang">
                    <div class="row g-2">
                        <!-- Menggunakan col-12 untuk HP, col-md-6 untuk Desktop -->
                        <div class="col-12 col-md-6">
                            <label for="namaBarang" class="form-label">Nama Barang</label>
                            <input type="text" class="form-control" id="namaBarang" name="nama" placeholder="Masukkan nama barang" required>
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="jumlahBarang" class="form-label">Jumlah / Stok</label>
                            <input type="number" class="form-control" id="jumlahBarang" name="jumlah" placeholder="Contoh: 50" required>
                        </div>
                        <div class="col-12 col-md-2 d-flex align-items-end mt-3 mt-md-2">
                            <button type="submit" class="btn btn-primary w-100 fw-bold">Simpan</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Bagian Tabel Data Barang -->
        <div class="card">
            <div class="card-body">
                <h5 class="card-title mb-3">Daftar Stok Barang</h5>
                
                <!-- Class "table-responsive" ini yang membuat tabel aman di HP -->
                <div class="table-responsive">
                    <table class="table table-hover table-bordered align-middle mb-0">
                        <thead class="table-dark">
                            <tr class="text-center">
                                <th scope="col" style="width: 5%;">No</th>
                                <th scope="col" style="width: 50%;">Nama Barang</th>
                                <th scope="col" style="width: 20%;">Jumlah</th>
                                <th scope="col" style="width: 25%;">Aksi</th>
                            </tr>
                        </thead>
                        <!-- id="tabelBarang" disiapkan untuk disuntik data dari server.js melalui DOM -->
                        <tbody id="tabelBarang">
                            <!-- Data akan dimuat dari Backend (Node.js) di sini -->
                            <tr>
                                <td colspan="4" class="text-center text-muted">Sedang memuat data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
            </div>
        </div>
    </div>

    <!-- Memuat Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SCRIPT JAVASCRIPT ANDA -->
    <script>
        /**
         * PENTING: 
         * Di bawah ini adalah kerangka Script Fetch API.
         * Jika di file index.html Anda yang lama sudah ada script khusus 
         * untuk mengambil (GET) dan mengirim (POST) data ke server.js, 
         * silakan copy-paste script JS lama Anda ke dalam tag <script> ini.
         */

        // Contoh fungsi memuat data (silakan sesuaikan dengan API di backend server.js Anda)
        async function fetchBarang() {
            try {
                const response = await fetch('/api/barang'); // Sesuaikan rute URL ini dengan backend Anda
                const data = await response.json();
                
                const tabelBody = document.getElementById('tabelBarang');
                tabelBody.innerHTML = ''; // Kosongkan tabel

                if(data.length === 0) {
                    tabelBody.innerHTML = `<tr><td colspan="4" class="text-center">Belum ada barang di gudang.</td></tr>`;
                    return;
                }

                data.forEach((item, index) => {
                    tabelBody.innerHTML += `
                        <tr>
                            <td class="text-center">${index + 1}</td>
                            <td>${item.nama}</td>
                            <td class="text-center">${item.jumlah}</td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-danger" onclick="hapusBarang('${item.id}')">Hapus</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Gagal mengambil data:", error);
            }
        }

        // Panggil fungsi saat web dimuat
        // document.addEventListener('DOMContentLoaded', fetchBarang);
    </script>
</body>
</html>
